<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Chat Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 800px;
            margin-top: 2rem;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .risk-high {
            color: #dc3545;
        }
        .risk-medium {
            color: #ffc107;
        }
        .risk-low {
            color: #28a745;
        }
        #loading {
            display: none;
        }
        .recommendation-item {
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card mb-4">
            <div class="card-body">
                <h1 class="card-title text-center mb-4">Mental Health Chat Detector</h1>
                <div class="mb-3">
                    <label for="chatText" class="form-label">Enter chat message to analyze:</label>
                    <textarea class="form-control" id="chatText" rows="4" placeholder="Type or paste chat message here..."></textarea>
                </div>
                <button class="btn btn-primary w-100" onclick="analyzeText()">Analyze</button>
            </div>
        </div>

        <div id="loading" class="text-center mb-4">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div id="results" class="card" style="display: none;">
            <div class="card-body">
                <h2 class="card-title">Analysis Results</h2>
                
                <div class="mb-3">
                    <h4>Risk Level</h4>
                    <p id="riskLevel" class="h3"></p>
                </div>

                <div class="mb-3">
                    <h4>Sentiment Analysis</h4>
                    <p id="sentiment"></p>
                </div>

                <div class="mb-3">
                    <h4>Detected Categories</h4>
                    <div id="categories"></div>
                </div>

                <div class="mb-3">
                    <h4>Recommendations</h4>
                    <div id="recommendations"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function analyzeText() {
            const text = document.getElementById('chatText').value;
            if (!text) {
                alert('Please enter some text to analyze');
                return;
            }

            // Show loading spinner
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text }),
                });

                const data = await response.json();
                
                if (response.ok) {
                    displayResults(data);
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error analyzing text: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function displayResults(data) {
            // Display risk level
            const riskLevelElement = document.getElementById('riskLevel');
            riskLevelElement.textContent = data.risk_level.toUpperCase();
            riskLevelElement.className = `h3 risk-${data.risk_level}`;

            // Display sentiment
            document.getElementById('sentiment').textContent = 
                `Sentiment: ${data.sentiment.label} (Confidence: ${(data.sentiment.score * 100).toFixed(1)}%)`;

            // Display categories
            const categoriesElement = document.getElementById('categories');
            categoriesElement.innerHTML = '';
            if (Object.keys(data.detected_categories).length > 0) {
                for (const [category, matches] of Object.entries(data.detected_categories)) {
                    const categoryDiv = document.createElement('div');
                    categoryDiv.innerHTML = `<strong>${category}:</strong> ${matches.join(', ')}`;
                    categoriesElement.appendChild(categoryDiv);
                }
            } else {
                categoriesElement.textContent = 'No specific categories detected';
            }

            // Display recommendations
            const recommendationsElement = document.getElementById('recommendations');
            recommendationsElement.innerHTML = '';
            data.recommendations.forEach(rec => {
                const recDiv = document.createElement('div');
                recDiv.className = 'recommendation-item';
                recDiv.textContent = rec;
                recommendationsElement.appendChild(recDiv);
            });

            // Show results
            document.getElementById('results').style.display = 'block';
        }
    </script>
</body>
</html>
